<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মাধ্যমিক পড়াশোনা</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="/fonts.css">
<style>
:root{
  --slate:#1E3A34; --slate-2:#28483F; --paper:#FBF7EC; --paper-2:#F2EAD3;
  --ink:#22281f; --mustard:#E3A93B;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Hind Siliguri','Noto Sans Bengali','Nirmala UI',sans-serif;line-height:1.7;}
h1{font-family:'Baloo Da 2','Noto Sans Bengali',sans-serif;color:var(--paper);}
header{
  background:radial-gradient(circle at 8px 8px, rgba(227,169,59,.14) 1.4px, transparent 1.4px),
    linear-gradient(155deg, var(--slate-2) 0%, var(--slate) 62%, #142822 100%);
  background-size:26px 26px, cover; color:var(--paper); padding:56px 24px 70px; text-align:center;
}
header .tag{display:inline-block;background:var(--paper);color:var(--slate);font-weight:700;padding:6px 18px;border-radius:999px;border:2px dashed var(--mustard);transform:rotate(-2deg);font-family:'Baloo Da 2';font-size:13px;margin-bottom:16px;}
header h1{font-size:clamp(28px,6vw,44px);margin:0 0 10px;}
header p{color:#cfe3da;font-size:16px;max-width:520px;margin:0 auto;}
main{max-width:820px;margin:-40px auto 0;padding:0 20px 60px;position:relative;z-index:2;}
.class-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:10px;}
.class-card{background:#fff;border-radius:16px;padding:26px 16px;text-align:center;text-decoration:none;color:var(--ink);box-shadow:0 4px 18px rgba(0,0,0,.08);border:2px solid var(--paper-2);transition:.2s;}
.class-card.live:hover{border-color:var(--mustard);transform:translateY(-3px);}
.class-card.locked{opacity:.5;cursor:default;}
.class-card .emoji{font-size:32px;margin-bottom:8px;}
.class-card .num{font-family:'Baloo Da 2';font-weight:700;font-size:22px;color:var(--slate);}
.class-card .lbl{font-size:13px;color:#5b6b60;margin-top:2px;}
.class-card .status{margin-top:8px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;display:inline-block;}
.status.ready{background:#e6f4ea;color:#1B5E20;}
.status.soon{background:#f3e5f5;color:#6A1B9A;}
footer{text-align:center;padding:20px;color:#7d8a7f;font-size:13px;}
</style>
</head>
<body>
<header>
  <div class="tag">বাংলাদেশ জাতীয় শিক্ষাক্রম</div>
  <h1>মাধ্যমিক পড়াশোনা</h1>
  <p>৬ষ্ঠ থেকে ১০ম শ্রেণি — সহজ ভাষায়, ইন্টারেক্টিভ পদ্ধতিতে</p>
</header>
<main>
  <div class="class-grid">
    <a class="class-card live" href="./class6/">
      <div class="emoji">📖</div><div class="num">৬ষ্ঠ</div><div class="lbl">শ্রেণি</div>
      <div class="status ready">চলছে ✓</div>
    </a>
    <a class="class-card live" href="./class7/">
      <div class="emoji">📘</div><div class="num">৭ম</div><div class="lbl">শ্রেণি</div>
      <div class="status ready">চলছে ✓</div>
    </a>
    <a class="class-card live" href="./class8/">
      <div class="emoji">📙</div><div class="num">৮ম</div><div class="lbl">শ্রেণি</div>
      <div class="status ready">চলছে ✓</div>
    </a>
    <div class="class-card locked">
      <div class="emoji">📕</div><div class="num">৯ম</div><div class="lbl">শ্রেণি</div>
      <div class="status soon">শীঘ্রই</div>
    </div>
    <div class="class-card locked">
      <div class="emoji">🎓</div><div class="num">১০ম</div><div class="lbl">শ্রেণি</div>
      <div class="status soon">শীঘ্রই</div>
    </div>
  </div>
</main>
<footer>তৈরি করা হচ্ছে ভালোবাসা দিয়ে 💙 — বাংলাদেশের শিক্ষার্থীদের জন্য</footer>
</body>
</html>
