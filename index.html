<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মাধ্যমিক পড়াশোনা</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/fonts.css">
<style>
/* ══════════════════════════════════════════
   BASE DESIGN TOKENS
   (আগে style.css থেকে আসতো, এখন এই ফাইলেই আছে
    যাতে index.html একা দাঁড়িয়ে থাকতে পারে)
══════════════════════════════════════════ */
:root{
    --bg:#f4f6f9;
    --card-bg:#ffffff;
    --text:#16232f;
    --text-muted:#6b7c8d;
    --border-light:#e6ebf0;
    --card-shadow:0 2px 10px rgba(20,30,45,.06);
    --gold:#c99a3a;
    --c6:#1A5276;--c7:#1B5E20;--c8:#4A148C;--c9:#B71C1C;--c10:#E65100;
}
:root.dark-mode{
    --bg:#0d1620;
    --card-bg:#16212c;
    --text:#eef2f6;
    --text-muted:#93a3b3;
    --border-light:#233241;
    --card-shadow:0 2px 12px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
body{
    margin:0;
    font-family:'Noto Serif Bengali',serif;
    background:var(--bg);
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
    transition:background .2s,color .2s;
}
a{color:inherit;}

/* NAV */
.nav{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;background:var(--card-bg);
    border-bottom:1px solid var(--border-light);
}
.nav-back{
    display:none;background:none;border:none;color:var(--text-muted);
    font-family:inherit;font-size:.85rem;cursor:pointer;padding:4px 6px;
}
.nav-back.visible{display:inline-block;}
.nav-logo{font-size:1rem;font-weight:800;display:flex;align-items:center;gap:6px;}
.nav-tools{display:flex;align-items:center;gap:6px;}
.nav-tool-btn{
    background:var(--bg);border:1px solid var(--border-light);color:var(--text);
    font-family:inherit;font-size:.8rem;font-weight:700;padding:6px 10px;
    border-radius:10px;cursor:pointer;
}

/* HERO */
.idx-hero{padding:40px 20px 50px;text-align:center;color:#fff;position:relative;overflow:hidden;}
.idx-hero::before{content:attr(data-emoji);position:absolute;font-size:180px;opacity:.05;bottom:-30px;right:-10px;pointer-events:none;}
.idx-tag{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);font-size:.78rem;font-weight:600;padding:3px 14px;border-radius:20px;margin-bottom:12px;}
.idx-hero h1{font-size:1.7rem;font-weight:800;line-height:1.3;margin-bottom:8px;}
.idx-hero p{font-size:.9rem;opacity:.7;line-height:1.7;max-width:380px;margin:0 auto;}

.grid-wrap{padding:20px 16px 60px;max-width:720px;margin:0 auto;}
.sec-label{font-size:.75rem;font-weight:800;color:#8899aa;text-transform:uppercase;letter-spacing:.07em;padding:14px 4px 10px;}

/* CLASS GRID */
.class-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media(min-width:480px){.class-grid{grid-template-columns:repeat(3,1fr);}}
.class-card{background:var(--card-bg);border-radius:20px;padding:24px 16px 20px;text-align:center;cursor:pointer;box-shadow:var(--card-shadow);border-top:5px solid var(--acc,#1A5276);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;text-decoration:none;display:block;}
.class-card::after{content:attr(data-emoji);position:absolute;font-size:80px;opacity:.06;bottom:-16px;right:-10px;pointer-events:none;}
.class-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,.12);}
.class-card:active{transform:scale(.98);}
.class-num{font-size:2.2rem;font-weight:800;line-height:1;margin-bottom:6px;}
.class-label{font-size:.85rem;color:var(--text-muted);font-weight:600;}
.class-badge{display:inline-block;margin-top:8px;background:rgba(0,0,0,.06);color:var(--text-muted);font-size:.72rem;padding:2px 10px;border-radius:10px;}
:root.dark-mode .class-badge{background:rgba(255,255,255,.08);}

/* SUBJECT CARD */
.subject-card{background:var(--card-bg);border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:var(--card-shadow);display:flex;align-items:center;gap:16px;border-left:5px solid var(--acc,#1A5276);transition:transform .2s,box-shadow .2s;text-decoration:none;}
.subject-card.live{cursor:pointer;}
.subject-card.live:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.12);}
.subject-card.locked{opacity:.55;cursor:default;}
.subj-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;}
.subj-info{flex:1;}
.subj-name{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:4px;}
.subj-desc{font-size:.82rem;color:var(--text-muted);line-height:1.5;}
.subj-badge{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:10px;flex-shrink:0;}
.badge-ready{background:#e8f5e9;color:#1B5E20;}
.badge-soon{background:#f3e5f5;color:#6A1B9A;}
:root.dark-mode .badge-ready{background:#1a3322;color:#81c784;}
:root.dark-mode .badge-soon{background:#2a1a3a;color:#ce93d8;}

/* CHAPTER CARD */
.chapter-card{background:var(--card-bg);border-radius:16px;padding:18px;margin-bottom:11px;box-shadow:var(--card-shadow);display:flex;align-items:center;gap:14px;border-left:5px solid var(--acc,#1A5276);text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s;}
.chapter-card.live{cursor:pointer;}
.chapter-card.live:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.12);}
.chapter-card.locked{opacity:.55;cursor:default;}
.ch-num{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;flex-shrink:0;color:#fff;}
.ch-info{flex:1;}
.ch-title{font-size:.95rem;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:3px;}
.ch-page{font-size:.78rem;color:var(--text-muted);}
.ch-arrow{color:#ccc;font-size:1.1rem;flex-shrink:0;transition:transform .2s;}
.chapter-card.live:hover .ch-arrow{transform:translateX(3px);}

.coming-soon{text-align:center;padding:28px 20px;background:var(--card-bg);border-radius:16px;box-shadow:var(--card-shadow);margin-bottom:14px;}
.coming-soon-icon{font-size:2.5rem;margin-bottom:10px;}
.coming-soon h3{font-size:1rem;color:var(--text);margin-bottom:6px;}
.coming-soon p{font-size:.85rem;color:var(--text-muted);line-height:1.6;}

.breadcrumb{display:flex;align-items:center;gap:6px;padding:10px 20px;font-size:.8rem;color:var(--text-muted);max-width:720px;margin:0 auto;flex-wrap:wrap;}
.bc-btn{background:none;border:none;color:var(--gold);font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;padding:0;}
.bc-btn:hover{text-decoration:underline;}
.bc-sep{color:var(--text-muted);}

.idx-footer{text-align:center;padding:20px;font-size:.78rem;color:var(--text-muted);border-top:1px solid var(--border-light);}
</style>
</head>

/* ══════════════════════════════════════════════════════════════
   DARK MODE (localStorage ভিত্তিক, আগের মতোই)
══════════════════════════════════════════════════════════════ */
function initDarkMode(){
    if(localStorage.getItem('nagorik_dark')==='1'){
        document.documentElement.classList.add('dark-mode');
        document.getElementById('darkToggle').textContent='☀️';
    }
}
function toggleDarkMode(){
    var root = document.documentElement;
    var btn = document.getElementById('darkToggle');
    var on = root.classList.toggle('dark-mode');
    localStorage.setItem('nagorik_dark', on ? '1':'0');
    btn.textContent = on ? '☀️' : '🌙';
}

/* ══════════════════════════════════════════════════════════════
   ROUTER — hash-ভিত্তিক (#class/7, #subject/7/science)
   কোনো external app.js বা data/*.js লাগে না।
   অধ্যায়ের HTML ফাইলগুলো নিজেরাই সম্পূর্ণ স্বয়ংসম্পূর্ণ পেজ —
   তাই সেগুলোতে ক্লিক করলে সরাসরি সেই পেজে চলে যাবে (নতুন state লাগবে না)।
══════════════════════════════════════════════════════════════ */
var state = { view:'home', classNum:null, subjectKey:null };

function render(){
    var root = document.getElementById('appRoot');
    var back = document.getElementById('navBack');
    if (back) back.classList.toggle('visible', state.view !== 'home');
    updateBreadcrumb();
    window.scrollTo(0,0);

    if      (state.view === 'home')    root.innerHTML = renderHome();
    else if (state.view === 'class')   root.innerHTML = renderClass();
    else if (state.view === 'subject') root.innerHTML = renderSubject();
}

function goHome(){ state = {view:'home', classNum:null, subjectKey:null}; syncHash(); render(); }
function showClass(num){ state.view='class'; state.classNum=Number(num); syncHash(); render(); }
function showSubject(key){ state.view='subject'; state.subjectKey=key; syncHash(); render(); }
function goBack(){
    if (state.view === 'subject'){ state.view='class'; state.subjectKey=null; }
    else if (state.view === 'class'){ state.view='home'; state.classNum=null; }
    else return;
    syncHash(); render();
}

function currentSubject(){
    var subs = SUBJECTS[state.classNum] || [];
    return subs.find(function(s){ return s.key === state.subjectKey; });
}

function updateBreadcrumb(){
    var bc = document.getElementById('breadcrumb');
    var parts = ['<button class="bc-btn" onclick="goHome()">🏠 হোম</button>'];
    if (state.classNum){
        var cm = CLASS_META[state.classNum];
        if (state.view === 'class') parts.push('<span class="bc-sep">›</span><span style="color:var(--text-muted)">'+cm.label+'</span>');
        else parts.push('<span class="bc-sep">›</span><button class="bc-btn" onclick="showClass('+state.classNum+')">'+cm.label+'</button>');
    }
    if (state.subjectKey){
        var s = currentSubject();
        if (s) parts.push('<span class="bc-sep">›</span><span style="color:var(--text-muted)">'+s.name+'</span>');
    }
    bc.innerHTML = parts.join('');
}

function renderHome(){
    var cards = Object.keys(CLASS_META).map(function(num){
        var cm = CLASS_META[num];
        return '<a href="#class/'+num+'" class="class-card" style="--acc:'+cm.color+'" data-emoji="'+cm.emoji+'" onclick="showClass('+num+');return false;">'+
            '<div class="class-num" style="color:'+cm.color+'">'+cm.label.replace(' শ্রেণি','')+'</div>'+
            '<div class="class-label">শ্রেণি</div>'+
            '<div class="class-badge">'+(cm.ready?'চলছে ✓':'শীঘ্রই')+'</div></a>';
    }).join('');
    return '<div class="idx-hero" data-emoji="🏫" style="background:linear-gradient(150deg,#0d2f45,#1a6b3a)">'+
        '<div class="idx-tag">বাংলাদেশ জাতীয় শিক্ষাক্রম</div>'+
        '<h1>মাধ্যমিক পড়াশোনা</h1>'+
        '<p>৬ষ্ঠ থেকে ১০ম শ্রেণি — সহজ ভাষায়, ইন্টারেক্টিভ পদ্ধতিতে</p></div>'+
        '<div class="grid-wrap"><div class="sec-label">শ্রেণি বেছে নাও</div>'+
        '<div class="class-grid">'+cards+'</div></div>';
}

function renderClass(){
    var cm = CLASS_META[state.classNum];
    var subs = SUBJECTS[state.classNum] || [];
    var inner = '';
    if (!subs.length){
        inner = '<div class="coming-soon"><div class="coming-soon-icon">🚧</div><h3>'+cm.label+' — শীঘ্রই আসছে</h3><p>এই শ্রেণির বিষয়গুলো তৈরি হচ্ছে।</p></div>';
    } else {
        inner = '<div class="sec-label">বিষয়সমূহ</div>' + subs.map(function(s){
            var tag = s.ready ? 'a' : 'div';
            var hrefAttr = s.ready ? ' href="#subject/'+state.classNum+'/'+s.key+'"' : '';
            var clickAttr = s.ready ? ' onclick="showSubject(\''+s.key+'\');return false;"' : '';
            return '<'+tag+hrefAttr+' class="subject-card '+(s.ready?'live':'locked')+'" style="--acc:'+cm.color+'"'+clickAttr+'>'+
                '<div class="subj-icon" style="background:'+s.iconBg+'">'+s.icon+'</div>'+
                '<div class="subj-info"><div class="subj-name">'+s.name+'</div>'+
                '<div class="subj-desc">'+(s.ready?(s.chapters.length+'টি অধ্যায়'):'শীঘ্রই আসছে')+'</div></div>'+
                '<span class="subj-badge '+(s.ready?'badge-ready':'badge-soon')+'">'+(s.ready?'✓ পড়া যাচ্ছে':'শীঘ্রই')+'</span></'+tag+'>';
        }).join('');
    }
    return '<div class="idx-hero" data-emoji="'+cm.emoji+'" style="background:linear-gradient(150deg,'+cm.color+'cc,'+cm.color+')">'+
        '<div class="idx-tag">'+cm.label+'</div><h1>'+cm.label+'</h1><p>বিষয় বেছে নাও</p></div>'+
        '<div class="grid-wrap">'+inner+'</div>';
}

function renderSubject(){
    var s = currentSubject();
    var cm = CLASS_META[state.classNum];
    if (!s) return '<div class="grid-wrap"><div class="coming-soon"><div class="coming-soon-icon">⚠️</div><h3>বিষয় পাওয়া যায়নি</h3></div></div>';
    var chaps = s.chapters.map(function(ch){
        return '<a href="'+s.base+ch.file+'" class="chapter-card live" style="--acc:'+cm.color+'">'+
            '<div class="ch-num" style="background:'+cm.color+'">'+ch.num+'</div>'+
            '<div class="ch-info"><div class="ch-title">'+ch.title+'</div></div>'+
            '<div class="ch-arrow">›</div></a>';
    }).join('');
    return '<div class="idx-hero" data-emoji="'+s.icon+'" style="background:linear-gradient(150deg,'+cm.color+'cc,'+cm.color+')">'+
        '<div class="idx-tag">'+cm.label+' • '+s.name+'</div>'+
        '<h1>'+s.name+'</h1><p>'+s.chapters.length+'টি অধ্যায়</p></div>'+
        '<div class="grid-wrap"><div class="sec-label">অধ্যায়সমূহ</div>'+chaps+'</div>';
}

/* ── URL hash sync, so back/forward বাটন ও শেয়ার করা লিংক কাজ করে ── */
function syncHash(){
    if (state.view === 'home') history.replaceState(null,'', '#');
    else if (state.view === 'class') history.replaceState(null,'', '#class/'+state.classNum);
    else if (state.view === 'subject') history.replaceState(null,'', '#subject/'+state.classNum+'/'+state.subjectKey);
}
function parseHash(){
    var h = location.hash.replace(/^#/, '');
    if (!h){ state = {view:'home', classNum:null, subjectKey:null}; return; }
    var parts = h.split('/');
    if (parts[0] === 'class' && parts[1]){ state = {view:'class', classNum:Number(parts[1]), subjectKey:null}; }
    else if (parts[0] === 'subject' && parts[1] && parts[2]){ state = {view:'subject', classNum:Number(parts[1]), subjectKey:parts[2]}; }
    else { state = {view:'home', classNum:null, subjectKey:null}; }
}
window.addEventListener('hashchange', function(){ parseHash(); render(); });

document.addEventListener('DOMContentLoaded', function(){
    initDarkMode();
    parseHash();
    render();
});
</script>
</body>
</html>
