<script>
try {
  (function() {
    var h2List = document.querySelectorAll('h2');
    var lessons = [];
    h2List.forEach(function(h2) {
      if (/^Lesson\s+\d+/i.test(h2.textContent.trim())) {
        lessons.push(h2);
      }
    });
    if (lessons.length === 0) return;

    lessons.forEach(function(h2, i) {
      if (!h2.id) h2.id = 'lesson-' + (i + 1);
    });

    var homeLink = document.getElementById('site-home-link');
    if (!homeLink) return;

    var style = document.createElement('style');
    style.textContent = [
      '.lesson-nav-wrapper {',
      '  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px;',
      '}',
      '.lesson-nav-wrapper #site-home-link, .lesson-chip {',
      '  display: inline-flex; align-items: center; gap: 6px;',
      '  padding: 6px 15px; border: 2px solid #0d6b5f; border-radius: 20px;',
      '  color: #0d6b5f; background: transparent; text-decoration: none;',
      '  font-family: sans-serif; font-size: 0.85em; font-weight: bold;',
      '  cursor: pointer; transition: all 0.25s ease; white-space: nowrap; flex-shrink: 0;',
      '}',
      '.lesson-nav-wrapper #site-home-link:hover, .lesson-chip:hover {',
      '  background: #0d6b5f; color: #fff;',
      '}',
      '.lesson-chip.active { background: #0d6b5f; color: #fff; }',
      '.lesson-highlight { animation: lessonFlash 2s ease forwards; border-radius: 4px; }',
      '@keyframes lessonFlash {',
      '  0% { background-color: #fffde7; }',
      '  25% { background-color: #fff9c4; }',
      '  100% { background-color: transparent; }',
      '}'
    ].join('\n');
    document.head.appendChild(style);

    var wrapper = document.createElement('div');
    wrapper.className = 'lesson-nav-wrapper';
    homeLink.parentNode.insertBefore(wrapper, homeLink);
    wrapper.appendChild(homeLink);

    lessons.forEach(function(h2, i) {
      var chip = document.createElement('a');
      chip.className = 'lesson-chip';
      chip.href = '#' + h2.id;
      chip.textContent = 'Lesson ' + (i + 1);

      chip.addEventListener('click', function(e) {
        e.preventDefault();
        h2.scrollIntoView({ behavior: 'smooth' });
        lessons.forEach(function(h) { h.classList.remove('lesson-highlight'); });
        void h2.offsetWidth;
        h2.classList.add('lesson-highlight');
        wrapper.querySelectorAll('.lesson-chip').forEach(function(c) { c.classList.remove('active'); });
        chip.classList.add('active');
      });

      wrapper.appendChild(chip);
    });
  })();
} catch (err) {
  console.error('Lesson nav script error:', err);
}
</script>
