<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[অধ্যায়ের শিরোনাম] — ইন্টারেক্টিভ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Baloo+Da+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════
   THEME — প্রতিটা অধ্যায়ের জন্য এই ৫টা রং বদলাও।
   master-prompt.md-এর বিষয়ভিত্তিক রং-নির্দেশিকা দেখো।
   ══════════════════════════════════════════════════════════ */
:root {
  --c1:       #1A5276;   /* প্রধান রং (nav, hero দের বেস) */
  --c1-deep:  #0d2f45;
  --c2:       #D4730A;   /* দ্বিতীয় রং (accent, progress bar) */
  --c2-deep:  #8a4900;
  --c3:       #007A6E;   /* তৃতীয় রং (hero variant) */
  --c3-deep:  #004d44;
  --c4:       #5C3D2E;   /* চতুর্থ রং (hero variant) */
  --c4-deep:  #3d2218;
  --c5:       #1B5E20;   /* পঞ্চম রং (hero variant) */
  --c5-deep:  #0d3610;
  --dark:     #0d1b2a;
  --cream:    #FDFAF4;
  --card-shadow: 0 4px 24px rgba(0,0,0,0.09);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background: var(--cream); font-family:'Hind Siliguri',sans-serif; min-height:100vh; color:#1a1a2e; -webkit-font-smoothing:antialiased; }

/* ── NAV ── */
.nav{background:var(--dark);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.35)}
.nav-logo{font-family:'Baloo Da 2',cursive;color:#fff;font-size:1rem;display:flex;align-items:center;gap:8px}
.nav-back{background:rgba(255,255,255,0.12);border:none;color:white;padding:7px 14px;border-radius:20px;font-family:'Hind Siliguri',sans-serif;font-size:0.85rem;cursor:pointer;display:none;align-items:center;gap:6px;transition:background 0.2s}
.nav-site-home{text-decoration:none;color:rgba(255,255,255,0.75);font-size:1.1rem;display:flex;align-items:center;padding:4px 8px;border-radius:10px;transition:background 0.2s}
.nav-site-home:hover{background:rgba(255,255,255,0.12)}
.nav-back:hover{background:rgba(255,255,255,0.22)}
.nav-back.visible{display:flex}
.progress-bar{height:3px;background:rgba(255,255,255,0.12)}
.progress-fill{height:100%;background:var(--c2);transition:width 0.4s ease;width:0%}

/* ── PAGE ROUTING ── */
.page{display:none}
.page.active{display:block}

/* ── HOME ── */
.home-header{background:linear-gradient(150deg,var(--c1) 0%,var(--c1-deep) 60%,var(--dark) 100%);padding:26px 20px 22px;text-align:center;position:relative;overflow:hidden}
.home-header::before{content:attr(data-emoji);position:absolute;font-size:200px;opacity:0.05;bottom:-40px;right:-20px;pointer-events:none}
.home-chapter-tag{display:inline-block;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.8);font-size:0.72rem;padding:3px 12px;border-radius:20px;letter-spacing:0.06em;margin-bottom:8px}
.home-emoji{font-size:2rem;display:block;margin-bottom:6px}
.home-header h1{font-family:'Baloo Da 2',cursive;color:#fff;font-size:1.5rem;line-height:1.25;margin-bottom:6px}
.home-header p{color:rgba(255,255,255,0.65);font-size:0.85rem;margin-bottom:4px}
.home-hint{text-align:center;padding:14px;color:#888;font-size:0.85rem}

/* ── LESSON CARDS ── */
.lesson-list{padding:20px 16px 40px;max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.lesson-card{background:white;border-radius:16px;padding:18px;box-shadow:var(--card-shadow);border-left:5px solid var(--c1);cursor:pointer;display:flex;align-items:center;gap:14px;transition:transform 0.2s,box-shadow 0.2s}
.lesson-card:hover{transform:translateX(4px);box-shadow:0 8px 28px rgba(0,0,0,0.13)}
.lesson-card.type-2 { border-left-color: var(--c2); }
.lesson-card.type-3 { border-left-color: var(--c3); }
.lesson-card.type-4 { border-left-color: var(--c4); }
.lesson-card.type-5 { border-left-color: var(--c5); }
.lesson-num{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Baloo Da 2',cursive;font-size:0.8rem;font-weight:800;color:white;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,0.2);background:linear-gradient(135deg,var(--c1),var(--c1-deep))}
.lesson-card.type-2 .lesson-num{background:linear-gradient(135deg,var(--c2),var(--c2-deep))}
.lesson-card.type-3 .lesson-num{background:linear-gradient(135deg,var(--c3),var(--c3-deep))}
.lesson-card.type-4 .lesson-num{background:linear-gradient(135deg,var(--c4),var(--c4-deep))}
.lesson-card.type-5 .lesson-num{background:linear-gradient(135deg,var(--c5),var(--c5-deep))}
.lesson-info{flex:1}
.lesson-title{font-family:'Baloo Da 2',cursive;font-size:0.95rem;color:#111827;margin-bottom:3px;line-height:1.3}
.lesson-sub{font-size:0.78rem;color:#888}
.lesson-arrow{color:#ccc;font-size:1.1rem;transition:transform 0.2s,color 0.2s}
.lesson-card:hover .lesson-arrow{color:var(--c1);transform:translateX(3px)}

/* ── DETAIL HERO ── */
.detail-hero{padding:36px 20px 44px;color:white;position:relative;overflow:hidden}
.detail-hero::after{content:attr(data-icon);position:absolute;font-size:150px;opacity:0.07;bottom:-20px;right:-10px;pointer-events:none}
.detail-badge{display:inline-block;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);color:white;font-family:'Baloo Da 2',cursive;font-size:0.85rem;padding:4px 14px;border-radius:20px;margin-bottom:12px}
.detail-title{font-family:'Baloo Da 2',cursive;font-size:1.45rem;line-height:1.25;margin-bottom:8px}
.detail-subtitle{font-size:0.9rem;opacity:0.8}

.hero-1{background:linear-gradient(160deg,var(--c1) 0%,var(--c1-deep) 100%);padding-bottom:36px}
.hero-2{background:linear-gradient(150deg,var(--c2) 0%,var(--c2-deep) 100%);clip-path:polygon(0 0,100% 0,100% 100%,72% 87%,50% 100%,28% 87%,0% 100%);padding-bottom:56px}
.hero-3{background:linear-gradient(150deg,var(--c3) 0%,var(--c3-deep) 100%);clip-path:polygon(0 0,100% 0,100% 88%,70% 100%,40% 88%,0% 100%);padding-bottom:56px}
.hero-4{background:linear-gradient(150deg,var(--c4) 0%,var(--c4-deep) 100%);clip-path:polygon(0 0,100% 0,100% 94%,50% 100%,0% 94%);padding-bottom:48px}
.hero-5{background:linear-gradient(160deg,var(--c5) 0%,var(--c5-deep) 100%);clip-path:polygon(0 0,100% 0,100% 100%,78% 90%,56% 100%,34% 90%,12% 100%,0% 90%);padding-bottom:56px}

.detail-body{padding:20px 16px 48px;max-width:680px;margin:0 auto}

/* ── GENERIC SECTION CARD ── */
.section{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--card-shadow)}
.section-title{font-family:'Baloo Da 2',cursive;font-size:1rem;font-weight:800;color:#111827;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-text{font-size:0.9rem;color:#333;line-height:1.7}

/* ── STORY BOX (উদাহরণ/গল্প) ── */
.story-box{background:#f0f6ff;border:2px solid #a0c4f0;border-radius:12px;padding:14px 16px;margin:12px 0;font-size:0.88rem;color:#333;line-height:1.65}
.story-box.c2{background:#fff8f0;border-color:#f5c98a}
.story-box.c3{background:#f0fff8;border-color:#b0e8d0}
.story-box.c4{background:#fdf5f0;border-color:#d4a890}
.story-box.c5{background:#f0fdf4;border-color:#90d4a8}
.story-label{font-family:'Baloo Da 2',cursive;font-size:0.78rem;font-weight:800;color:#4a5a8a;margin-bottom:6px}

/* ── QUALITY GRID (ছোট আইকন-কার্ডের গ্রিড — ঋতু/গুণ/ধরন ইত্যাদি তালিকার জন্য) ── */
.quality-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px}
.quality-item{background:#f5f8ff;border:1.5px solid #dce8f8;border-radius:12px;padding:14px 10px;text-align:center;transition:transform 0.2s,box-shadow 0.2s}
.quality-item.clickable{cursor:pointer}
.quality-item.clickable:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(26,82,118,0.12)}
.quality-item.clickable:active{transform:scale(0.97)}
.q-icon{font-size:1.5rem;margin-bottom:6px}
.q-label{font-size:0.78rem;color:#333;font-weight:600;line-height:1.35}

/* ── BOOK QUOTE BOX (পাঠ্যবইয়ের হুবহু/কাছাকাছি ভাষা) ── */
.book-box{background:#faf7f0;border:1.5px solid #e5dcc5;border-left:4px solid var(--c2);border-radius:0 12px 12px 0;padding:16px 18px;margin:12px 0;font-size:0.87rem;color:#4a3f2a;line-height:1.75}
.book-box p{margin-bottom:8px}
.book-box p:last-child{margin-bottom:0}

/* ── ACTIVITY BOX (করে দেখো / কাজ) ── */
.activity-box{background:var(--dark);border-radius:14px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;margin:12px 0}
.activity-num{font-family:'Baloo Da 2',cursive;font-size:1.05rem;font-weight:800;color:var(--c2);flex-shrink:0}
.activity-text{font-size:0.86rem;color:rgba(255,255,255,0.85);line-height:1.6}

/* ── SUBTOPIC divider (একটা section-এর ভেতরে একাধিক ভাগ থাকলে) ── */
.subtopic{border-top:1.5px solid #f0f0f0;padding-top:14px;margin-top:14px}
.subtopic:first-child{border-top:none;padding-top:0;margin-top:0}
.subtopic-title{font-family:'Baloo Da 2',cursive;font-size:0.9rem;font-weight:800;color:#444;margin-bottom:8px}

/* ── MCQ (বহুনির্বাচনি প্রশ্ন) ── */
.mcq-item{border:1.5px solid #eee;border-radius:12px;padding:14px 16px;margin-bottom:12px}
.mcq-item:last-child{margin-bottom:0}
.mcq-question{font-size:0.88rem;font-weight:600;color:#111827;margin-bottom:8px;line-height:1.6}
.mcq-note{font-size:0.83rem;color:#555;background:#f7f7f7;padding:8px 12px;border-radius:8px;margin-bottom:10px;line-height:1.6}
.mcq-options{display:flex;flex-direction:column;gap:7px}
.mcq-option{border:1.5px solid #e0e0e0;border-radius:10px;padding:9px 14px;font-size:0.85rem;cursor:pointer;transition:background 0.2s,border-color 0.2s;color:#333}
.mcq-option:hover{border-color:var(--c1)}
.mcq-option.disabled{cursor:default}
.mcq-option.correct{background:#e8f8ee;border-color:#2e7d4f;color:#1b5e35;font-weight:600}
.mcq-option.wrong{background:#fdecea;border-color:#c0392b;color:#922b21}

/* ── QA (প্রশ্নোত্তর) ── */
.qa-list{display:flex;flex-direction:column;gap:10px}
.qa-item{border:1.5px solid #eee;border-radius:12px;overflow:hidden;transition:border-color 0.2s}
.qa-item.open{border-color:var(--c1)}
.qa-q{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:0.88rem;font-weight:600;color:#111827;background:white;gap:10px;user-select:none}
.qa-q:hover{background:#f8f8f8}
.qa-q-text{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.qa-tag{display:inline-block;background:var(--c1);color:white;font-size:0.68rem;font-weight:800;padding:2px 9px;border-radius:10px;font-family:'Baloo Da 2',cursive;flex-shrink:0}
.qa-icon{width:26px;height:26px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0;transition:background 0.2s,transform 0.3s}
.qa-item.open .qa-icon{background:var(--c1);color:white;transform:rotate(180deg)}
.qa-a{max-height:0;overflow:hidden;transition:max-height 0.35s ease,padding 0.2s;background:#f7fbff;font-size:0.87rem;color:#333;line-height:1.7;padding:0 16px}
.qa-item.open .qa-a{max-height:800px;padding:12px 16px}

/* ── WORD CHIPS ── */
.word-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:#f0f0f0;border:1.5px solid #e0e0e0;border-radius:20px;padding:5px 14px;font-size:0.82rem;cursor:pointer;transition:background 0.2s,border-color 0.2s,transform 0.1s;color:#333;font-weight:600}
.chip:hover{background:var(--c1);color:white;border-color:var(--c1);transform:scale(1.04)}
.chip:active{transform:scale(0.97)}

/* ── CHAIN BOX (এরপর কী?) ── */
.chain-box{background:#f0f4ff;border:1.5px solid #c0d0f0;border-radius:12px;padding:14px 16px;font-size:0.87rem;color:#1e2a3a;line-height:1.7}
.chain-box-label{font-family:'Baloo Da 2',cursive;font-size:0.78rem;font-weight:800;color:#4a5a8a;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px}

/* ── WORD POPUP ── */
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:none;align-items:flex-end;justify-content:center}
.popup-overlay.show{display:flex;animation:fadeOverlay 0.2s ease}
@keyframes fadeOverlay{from{opacity:0}to{opacity:1}}
.popup{background:white;border-radius:24px 24px 0 0;padding:28px 24px 36px;width:100%;max-width:600px;animation:slideUp 0.3s ease}
@keyframes slideUp{from{transform:translateY(80px);opacity:0}to{transform:translateY(0);opacity:1}}
.popup-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 20px}
.popup-word{font-family:'Baloo Da 2',cursive;font-size:1.4rem;color:var(--c1);margin-bottom:6px}
.popup-meaning{font-size:0.88rem;color:#555;margin-bottom:14px;line-height:1.5}
.popup-example{background:#f0f6ff;border-left:3px solid var(--c1);padding:10px 14px;border-radius:0 10px 10px 0;font-size:0.86rem;color:#333;line-height:1.6}
.popup-close{margin-top:18px;width:100%;padding:12px;background:var(--c1);color:white;border:none;border-radius:12px;font-family:'Hind Siliguri',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;transition:background 0.2s}
.popup-close:hover{background:var(--c1-deep)}

/* ── KEY TOPICS BAR ── */
.key-topics-bar{background:var(--dark);padding:20px;text-align:center}
.key-topics-bar p{color:rgba(255,255,255,0.5);font-size:0.75rem;margin-bottom:10px;text-transform:uppercase;letter-spacing:0.05em}
.key-topics-wrap{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.key-topic-chip{background:rgba(255,255,255,0.1);color:white;font-family:'Baloo Da 2',cursive;font-size:0.78rem;padding:4px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);cursor:pointer;transition:background 0.2s}
.key-topic-chip:hover{background:rgba(255,255,255,0.22)}

@media (max-width:480px){
  .home-header{padding:20px 16px 18px}
  .home-emoji{font-size:1.7rem;margin-bottom:4px}
  .home-chapter-tag{font-size:0.66rem;padding:3px 10px;margin-bottom:6px}
  .home-header h1{font-size:1.15rem;margin-bottom:4px}
  .home-header p{font-size:0.78rem}
  .home-hint{font-size:0.75rem;padding:10px}
  .detail-title{font-size:1.2rem}
  .lesson-title{font-size:0.88rem}
  .quality-grid{gap:8px}
}
@media print{
  .activity-box{background:#f0f0f0!important;border:1px solid #999}
  .activity-text{color:#333!important}
}
</style>
</head>
<body>

<nav class="nav">
  <div style="display:flex;align-items:center;gap:10px;">
    <a class="nav-site-home" href="../../index.html" title="মূল হোম">🏠</a>
    <div class="nav-logo" id="navLogo">[ইমোজি] [অধ্যায়ের ছোট নাম]</div>
  </div>
  <button class="nav-back" id="navBack" onclick="goHome()">← ফিরে যাও</button>
</nav>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<!-- HOME PAGE -->
<div class="page active" id="homePage">
  <div class="home-header" id="homeHeader">
    <div class="home-chapter-tag" id="homeChapterTag">৭ম শ্রেণি · [অধ্যায় নম্বর]</div>
    <span class="home-emoji" id="homeEmoji">📘</span>
    <h1 id="homeTitle">[অধ্যায়ের পুরো শিরোনাম]</h1>
    <p id="homeSubtitle">প্রশ্নোত্তর ও শব্দার্থসহ</p>
  </div>
  <p class="home-hint">যেকোনো পাঠে ট্যাপ করো বিস্তারিত জানতে</p>
  <div class="lesson-list" id="lessonList"></div>
  <div class="key-topics-bar">
    <p>গুরুত্বপূর্ণ বিষয়গুলো</p>
    <div class="key-topics-wrap" id="keyTopics"></div>
  </div>
</div>

<!-- DETAIL PAGE -->
<div class="page" id="detailPage">
  <div id="detailContent"></div>
</div>

<!-- WORD POPUP -->
<div class="popup-overlay" id="popupOverlay" onclick="closePopup(event)">
  <div class="popup">
    <div class="popup-handle"></div>
    <div class="popup-word" id="popupWord"></div>
    <div class="popup-meaning" id="popupMeaning"></div>
    <div class="popup-example" id="popupExample"></div>
    <button class="popup-close" onclick="closePopupBtn()">বুঝে গেছি! ✓</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   ⬇️⬇️⬇️  DATA START — শুধু এই অংশ বদলে নতুন অধ্যায় বানাও  ⬇️⬇️⬇️
   পুরো schema আর নিয়মের বিস্তারিত ব্যাখ্যা: template-guide.md দেখো।
   ══════════════════════════════════════════════════════════════ */

const chapterInfo = {
  num: 'একাদশ অধ্যায়',
  emoji: '🕊️',
  navLabel: '🕊️ আন্তর্জাতিক সহযোগিতা',
  title: 'বাংলাদেশ ও আন্তর্জাতিক সহযোগিতা',
  subtitle: 'প্রশ্নোত্তর ও শব্দার্থসহ'
};

// প্রতিটা শব্দের জন্য meaning + example — এই অধ্যায়ের জন্যই আলাদা (shared নয়)
const words = {
  'আন্তর্জাতিক সহযোগিতা': {
    meaning: 'বিভিন্ন দেশ বা সংস্থার মধ্যে পারস্পরিক সহায়তার মাধ্যমে সমস্যা সমাধান বা উন্নয়ন সাধনের প্রক্রিয়া।',
    example: 'শিক্ষা, স্বাস্থ্য, পরিবেশের মতো ক্ষেত্রে বাংলাদেশ আন্তর্জাতিক সহযোগিতা নিয়ে থাকে।'

// ══════════════════════════════
// INIT HOME HEADER TEXT
// ══════════════════════════════

// ══════════════════════════════
// RENDER HOME
// ══════════════════════════════
function renderHome() {
  const list = document.getElementById('lessonList');
  list.innerHTML = lessons.map(l => `
    ${l.id === 'l_শেষ' || l.num === 'অনুশীলনী' ? '<div style="border-top:2px dashed #ddd;margin:8px 0 4px;padding-top:4px;text-align:center;font-size:0.78rem;color:#aaa;">পরীক্ষার প্রস্তুতি</div>' : ''}
    <div class="lesson-card ${l.type || ''}" onclick="openDetail('${l.id}')">
      <div class="lesson-num">${l.num}</div>
      <div class="lesson-info">
        <div class="lesson-title">${l.icon} ${l.title}</div>
        <div class="lesson-sub">${l.sub || ''}</div>
      </div>
      <span class="lesson-arrow">›</span>
    </div>
  `).join('');

  document.getElementById('keyTopics').innerHTML = keyTopics.map(k => `
    <span class="key-topic-chip" onclick="openDetail('${k.id}')">${k.label}</span>
  `).join('');
}

// ══════════════════════════════
// RENDER ONE SECTION (generic — handles all block types)
// ══════════════════════════════
function renderSection(s) {
  // Activity-only block (no card wrapper needed inside a card, but keep consistent: standalone card)
  if (s.activity !== undefined && s.title === undefined) {
    return `
      <div class="section">
        <div class="activity-box">
          <div class="activity-num">কাজ</div>
          <div class="activity-text">${s.activity}</div>
        </div>
      </div>`;
  }

  let inner = '';
  if (s.text) inner += `<div class="section-text">${s.text}</div>`;
  if (s.story) inner += `<div class="story-box ${s.storyClass || ''}" style="margin-top:${s.text ? '14px' : '0'}">${s.storyLabel ? `<div class="story-label">${s.storyLabel}</div>` : ''}${s.story}</div>`;
  if (s.qualityItems) {
    inner += `<div class="quality-grid">${s.qualityItems.map(q => `
      <div class="quality-item ${q.word ? 'clickable' : ''}" ${q.word ? `onclick="showWord('${q.word}')"` : ''}>
        <div class="q-icon">${q.icon}</div>
        <div class="q-label">${q.label}</div>
      </div>`).join('')}</div>`;
  }
  if (s.bookOrig) inner += `<div class="book-box">${s.bookOrig}</div>`;
  if (s.activity) inner += `<div class="activity-box"><div class="activity-num">কাজ</div><div class="activity-text">${s.activity}</div></div>`;
  if (s.mcqs) {
    inner += s.mcqs.map(m => `
      <div class="mcq-item">
        <div class="mcq-question">${m.question}</div>
        ${m.note ? `<div class="mcq-note">${m.note}</div>` : ''}
        <div class="mcq-options">${m.options.map(o => `
          <div class="mcq-option" data-correct="${o.correct}" onclick="checkMCQ(this)">${o.text}</div>
        `).join('')}</div>
      </div>`).join('');
  }
  if (s.qa) {
    inner += `<div class="qa-list">${s.qa.map((q, i) => `
      <div class="qa-item" id="qa-${s._lessonId}-${s._sIdx}-${i}">
        <div class="qa-q" onclick="toggleQA('qa-${s._lessonId}-${s._sIdx}-${i}')">
          <span class="qa-q-text">${q.tag ? `<span class="qa-tag">${q.tag}</span>` : ''}${q.q}</span>
          <div class="qa-icon">▼</div>
        </div>
        <div class="qa-a">${q.a}</div>
      </div>`).join('')}</div>`;
  }
  if (s.chips) {
    inner += `<div class="word-chips">${s.chips.map(w => `<span class="chip" onclick="showWord('${w}')">${w}</span>`).join('')}</div>`;
  }

  return `
    <div class="section">
      ${s.title ? `<div class="section-title">${s.title}</div>` : ''}
      ${inner}
    </div>`;
}

// ══════════════════════════════
// OPEN DETAIL
// ══════════════════════════════
function openDetail(id) {
  const l = lessons.find(x => x.id === id);
  if (!l) return;

  const sectionsHtml = (l.sections || []).map((s, i) => {
    s._lessonId = id; s._sIdx = i;
    return renderSection(s);
  }).join('');

  document.getElementById('detailContent').innerHTML = `
    <div class="detail-hero ${l.heroClass}" data-icon="${l.icon}">
      <div class="detail-badge">${l.num}</div>
      <div class="detail-title">${l.icon} ${l.title}</div>
      <div class="detail-subtitle">${l.heroSub || ''}</div>
    </div>
    <div class="detail-body">
      ${sectionsHtml}
      ${l.chain ? `
      <div class="section">
        <div class="chain-box-label">➜ পরের অধ্যায়</div>
        <div class="chain-box">${l.chain}</div>
      </div>` : ''}
    </div>
  `;

  document.getElementById('homePage').classList.remove('active');
  document.getElementById('detailPage').classList.add('active');
  document.getElementById('navBack').classList.add('visible');
  document.getElementById('progressFill').style.width = '100%';
  window.scrollTo(0, 0);
}

// ══════════════════════════════
// GO HOME
// ══════════════════════════════
function goHome() {
  document.getElementById('detailPage').classList.remove('active');
  document.getElementById('homePage').classList.add('active');
  document.getElementById('navBack').classList.remove('visible');
  document.getElementById('progressFill').style.width = '0%';
  window.scrollTo(0, 0);
}

// ══════════════════════════════
// MCQ CHECK
// ══════════════════════════════
function checkMCQ(el) {
  const group = el.parentElement;
  if (group.classList.contains('answered')) return;
  group.classList.add('answered');
  Array.from(group.children).forEach(opt => {
    opt.classList.add('disabled');
    if (opt.dataset.correct === 'true') opt.classList.add('correct');
  });
  if (el.dataset.correct !== 'true') el.classList.add('wrong');
}

// ══════════════════════════════
// Q&A TOGGLE
// ══════════════════════════════
function toggleQA(id) {
  document.getElementById(id).classList.toggle('open');
}

// ══════════════════════════════
// WORD POPUP
// ══════════════════════════════
function showWord(word) {
  const w = words[word];
  if (!w) return;
  document.getElementById('popupWord').textContent = word;
  document.getElementById('popupMeaning').textContent = w.meaning;
  document.getElementById('popupExample').textContent = w.example;
  document.getElementById('popupOverlay').classList.add('show');
}
function closePopup(e) {
  if (e.target === document.getElementById('popupOverlay')) closePopupBtn();
}
function closePopupBtn() {
  document.getElementById('popupOverlay').classList.remove('show');
}

renderHome();
</script>
